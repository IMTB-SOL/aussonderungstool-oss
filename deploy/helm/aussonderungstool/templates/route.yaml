apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "aussonderungstool.fullname" . }}
  labels:
    {{- include "aussonderungstool.labels" . | nindent 4 }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "aussonderungstool.fullname" . }}
  port:
    targetPort: http
  {{- if .Values.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
