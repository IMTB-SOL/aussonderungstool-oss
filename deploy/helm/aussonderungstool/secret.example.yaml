# BEISPIEL — nicht direkt anwenden. Das echte Secret über die Secret-Verwaltung
# des Clusters bereitstellen (z. B. SealedSecret, External Secrets).
# Der Name muss values.yaml -> existingSecret entsprechen.
apiVersion: v1
kind: Secret
metadata:
  name: aussonderungstool-secrets
type: Opaque
stringData:
  # Pflicht — Schlüssel zum Signieren der Session-Cookies.
  # Erzeugen mit: python -c "import secrets; print(secrets.token_hex(32))"
  SESSION_SECRET: "BITTE-ERSETZEN"
  # Pflicht — Bearer-Token für den Prometheus-Scrape von /metrics
  # (ohne diesen Wert liefert /metrics 503).
  # Erzeugen mit: python -c "import secrets; print(secrets.token_urlsafe(32))"
  METRICS_TOKEN: "BITTE-ERSETZEN"
  # Pflicht bei AUTH_MODUS=passwort/beide — Erst-Admin beim ersten Start.
  INITIAL_ADMIN_EMAIL: "admin@example.com"
  INITIAL_ADMIN_PASSWORD: "BITTE-ERSETZEN"
  # Nur falls config.AUTH_MODUS=azure/beide:
  # AZURE_CLIENT_ID: ""
  # AZURE_TENANT_ID: ""
  # AZURE_CLIENT_SECRET: ""
  # Nur falls config.SCALEWAY_ENABLED=true:
  # SCALEWAY_API_KEY: ""
